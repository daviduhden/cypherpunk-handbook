# Configuration for htmltest (https://github.com/wjdp/htmltest).
# Offline checks only: links, anchors, images and metadata. External
# URLs are intentionally NOT requested here; use lychee for that.
# Run from the repository root, e.g. `htmltest -c .htmltest.yml`.
DirectoryPath: "."
# Check document structure and local references without fetching remote URLs.
CheckDoctype: true
CheckAnchors: true
CheckLinks: true
CheckInternal: true
# Keep remote link requests disabled so this check stays offline.
CheckExternal: false
CheckImages: true
CheckMeta: true
CheckGeneric: true
# These protocol targets are not HTTP pages that htmltest can resolve.
CheckMailto: false
CheckTel: false
IgnoreURLs:
  - "onion"
  - "i2p"
  - "mailto:"
  - "tel:"
  - "bitcoin:"
  - "monero:"
